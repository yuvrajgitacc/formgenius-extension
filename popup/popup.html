<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FormGenius</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <!-- 1. Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon-box">
          <span class="logo-sparkle">✦</span>
        </div>
        <div class="logo-text">
          <span class="logo-name">FormGenius</span>
          <span class="logo-tagline">AI Form Solver</span>
        </div>
      </div>
      <div class="status-dot" id="statusDot" title="Status: Ready"></div>
    </header>

    <!-- 2. Status Banner & Shortcut Card -->
    <div class="status-card status-banner" id="statusBanner">
      <div class="status-title-row">
        <span class="status-text" id="statusText">No Google Form active</span>
      </div>
      <div class="shortcut-row">
        <span class="shortcut-label">Solve Form / MCQ:</span>
        <div class="shortcut-keys">
          <kbd>Alt</kbd>
          <span class="shortcut-plus">+</span>
          <kbd>Shift</kbd>
          <span class="shortcut-plus">+</span>
          <kbd>S</kbd>
        </div>
      </div>
      <div class="shortcut-row code-shortcut-row">
        <span class="shortcut-label">Technical Code:</span>
        <div class="shortcut-keys">
          <kbd>Alt</kbd>
          <span class="shortcut-plus">+</span>
          <kbd>Shift</kbd>
          <span class="shortcut-plus">+</span>
          <kbd>C</kbd>
        </div>
      </div>
    </div>

    <!-- 3. AI Key & Provider Section -->
    <div class="api-key-section">
      <div class="api-key-header">
        <div class="api-key-header-left">
          <label class="label" id="apiKeyLabel" for="apiKey">Gemini API Key</label>
          <select id="providerSelect" class="provider-select" title="Change AI Provider">
            <option value="auto">Auto</option>
            <option value="gemini">Gemini</option>
            <option value="groq">Groq</option>
            <option value="grok">Grok</option>
            <option value="openai">OpenAI</option>
          </select>
        </div>
        <a id="getKeyLink" class="link-get-key" href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer">Get key ↗</a>
      </div>
      <div class="input-container">
        <input
          type="password"
          id="apiKey"
          class="input"
          placeholder="Paste API key here..."
          autocomplete="off"
          spellcheck="false"
        />
        <button class="eye-btn" id="toggleKey" title="Show/Hide Key" aria-label="Toggle Key Visibility">👁</button>
        <button class="btn-save" id="saveBtn">Save</button>
      </div>
    </div>

    <!-- 4. Action Buttons -->
    <div class="action-buttons-row">
      <button class="btn-action btn-solve-form" id="solveBtn" disabled title="Solve Form / MCQ (Alt+Shift+S)">
        <span class="btn-icon">⚡</span>
        <span>Solve Form Now</span>
      </button>
      <button class="btn-action btn-solve-code" id="solveCodeBtn" disabled title="Solve Technical Code in Editor (Alt+Shift+C)">
        <span class="btn-icon">💻</span>
        <span>Solve Code</span>
      </button>
    </div>

    <!-- 5. Statistics Section -->
    <div class="stats" id="stats">
      <div class="stat">
        <div class="stat-value" id="solvedCount">0</div>
        <div class="stat-label">Forms Solved</div>
      </div>
      <div class="stats-divider"></div>
      <div class="stat">
        <div class="stat-value" id="questionsCount">0</div>
        <div class="stat-label">Questions Solved</div>
      </div>
    </div>

    <!-- 6. Footer -->
    <footer class="footer">
      <div class="footer-left">
        <span class="footer-gear">⚙</span>
        <span>Stealth AI Engine</span>
      </div>
      <div class="footer-right">v1.2.0</div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
