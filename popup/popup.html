<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FormGenius</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon-box">
          <span class="logo-sparkle">✦</span>
        </div>
        <div class="logo-text">
          <span class="logo-name">FormGenius</span>
          <span class="logo-tagline">AI Form Solver</span>
        </div>
      </div>
      <div class="status-dot" id="statusDot" title="Status"></div>
    </header>

    <!-- Top Card: Status & Shortcut -->
    <div class="status-card" id="statusBanner">
      <div class="status-title-row">
        <span class="status-icon" style="display:none">⚠️</span>
        <span class="status-text" id="statusText">No Google Form active</span>
      </div>
      <div class="shortcut-row">
        <span class="shortcut-label">Press on form:</span>
        <div class="shortcut-keys">
          <kbd>Alt</kbd>
          <span class="shortcut-plus">+</span>
          <kbd>Shift</kbd>
          <span class="shortcut-plus">+</span>
          <kbd>S</kbd>
        </div>
      </div>
    </div>

    <!-- Gemini API Key Section -->
    <div class="api-key-section">
      <div class="api-key-header">
        <label class="label" id="apiKeyLabel" for="apiKey">Gemini API Key</label>
        <a href="https://aistudio.google.com/app/apikey" target="_blank" class="link-get-key" id="getKeyLink" rel="noreferrer">Get key ↗</a>
      </div>
      <div class="input-container">
        <input
          type="password"
          id="apiKey"
          class="input"
          placeholder="••••••••••••••••••••••••••••"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="eye-btn" id="toggleKey" title="Show/Hide Key" aria-label="Toggle API Key visibility">👁</button>
        <button class="btn-save" id="saveBtn">Save</button>
      </div>
    </div>

    <!-- Full-Width Solve Form Action Button -->
    <button class="btn-solve" id="solveBtn" disabled>
      <span class="btn-icon">⚡</span>
      <span>Solve Form Now</span>
    </button>

    <!-- Statistics Section with Vertical Divider -->
    <div class="stats" id="stats">
      <div class="stat">
        <div class="stat-value" id="solvedCount">0</div>
        <div class="stat-label">Forms Solved</div>
      </div>
      <div class="stats-divider"></div>
      <div class="stat">
        <div class="stat-value" id="questionsCount">0</div>
        <div class="stat-label">Questions Solved</div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-left">
        <span class="footer-gear">⚙</span>
        <span>Stealth AI Engine</span>
      </div>
      <div class="footer-right">v1.2.0</div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
