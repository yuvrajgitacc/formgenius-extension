<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FormGenius</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon-box">
          <span class="logo-sparkle">✦</span>
        </div>
        <div class="logo-text">
          <span class="logo-name">FormGenius</span>
          <span class="logo-tagline">AI Form Solver</span>
        </div>
      </div>
      <div class="status-dot" id="statusDot" title="Status"></div>
    </header>

    <!-- Top Card: Status & Shortcut -->
    <div class="status-card status-banner" id="statusBanner">
      <div class="status-title-row">
        <span class="status-icon" style="display:none">⚠️</span>
        <span class="status-text" id="statusText">AI Form Solver Ready</span>
      </div>
      <div class="shortcut-row">
        <span class="shortcut-label">Solve Form / MCQ:</span>
        <div class="shortcut-keys">
          <kbd>Alt</kbd>
          <span class="shortcut-plus">+</span>
          <kbd>Shift</kbd>
          <span class="shortcut-plus">+</span>
          <kbd>S</kbd>
        </div>
      </div>
      <div class="shortcut-row" style="margin-top: 3px;">
        <span class="shortcut-label">Technical Code:</span>
        <div class="shortcut-keys">
          <kbd>Alt</kbd>
          <span class="shortcut-plus">+</span>
          <kbd>Shift</kbd>
          <span class="shortcut-plus">+</span>
          <kbd>C</kbd>
        </div>
      </div>
    </div>

    <!-- Universal AI Provider & API Key Section -->
    <div class="api-key-section">
      <div class="api-key-header">
        <label class="label" for="apiKey">AI API Key</label>
        <div class="provider-wrapper">
          <select id="providerSelect" class="provider-select" title="Select AI Provider">
            <option value="auto">⚡ Auto-Detect</option>
            <option value="gemini">Google Gemini</option>
            <option value="groq">Groq (Ultra-Fast)</option>
            <option value="grok">xAI Grok</option>
            <option value="openai">OpenAI / Router</option>
          </select>
        </div>
      </div>
      <div class="input-container">
        <input
          type="password"
          id="apiKey"
          class="input"
          placeholder="Gemini (AIza...), Groq (gsk_...), Grok..."
          autocomplete="off"
          spellcheck="false"
        />
        <button class="eye-btn" id="toggleKey" title="Show/Hide Key" aria-label="Toggle API Key visibility">👁</button>
        <button class="btn-save" id="saveBtn">Save</button>
      </div>
    </div>

    <!-- Action Buttons (Form Solver & Code Solver) -->
    <div class="action-buttons-row">
      <button class="btn-action btn-solve-form" id="solveBtn" disabled title="Solve Form / MCQ (Alt+Shift+S)">
        <span class="btn-icon">⚡</span>
        <span>Solve Form</span>
      </button>
      <button class="btn-action btn-solve-code" id="solveCodeBtn" disabled title="Solve Coding in Editor (Alt+Shift+C)">
        <span class="btn-icon">💻</span>
        <span>Solve Code</span>
      </button>
    </div>

    <!-- Statistics Section with Vertical Divider -->
    <div class="stats" id="stats">
      <div class="stat">
        <div class="stat-value" id="solvedCount">0</div>
        <div class="stat-label">Forms Solved</div>
      </div>
      <div class="stats-divider"></div>
      <div class="stat">
        <div class="stat-value" id="questionsCount">0</div>
        <div class="stat-label">Questions Solved</div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-left">
        <span class="footer-gear">⚙</span>
        <span>Stealth AI Engine</span>
      </div>
      <div class="footer-right">v1.2.0</div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
